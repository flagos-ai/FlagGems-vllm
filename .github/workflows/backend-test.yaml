# Reusable job for one backend (non-NVIDIA lanes and the H20 nvidia-tests job)
# on a bare self-hosted runner. The
# vendor environment is built by this repository's tools/setup.sh from
# src/flaggems_vllm/backends.yaml, so nothing is fetched from the FlagGems
# repository.

name: Backend Test

on:
  workflow_call:
    inputs:
      backend:
        description: 'Backend profile (e.g. ascend-cann900, mthreads-musa520)'
        required: true
        type: string
      runner_label:
        description: 'GitHub Actions runner label'
        required: true
        type: string
      gpu_check_script:
        description: 'Path to the accelerator check script (empty to skip)'
        required: false
        type: string
        default: ''
      changed_files:
        description: 'CI targets JSON consumed by tools/run_ci_targets.py'
        required: false
        type: string
        default: ''
      test_script:
        description: 'Script that runs the selected targets'
        required: false
        type: string
        default: 'tools/run-multi-backend-tests.sh'
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 120
      uv_refresh:
        description: >-
          Set to 1 on persistent runners whose uv cache survives across jobs, so
          tools/setup.sh revalidates it (a stale entry can report success
          without installing into the freshly recreated venv). Empty keeps the
          setup.sh default.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      UV_REFRESH: ${{ inputs.uv_refresh }}
    concurrency:
      group: >-
        backend-test-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      - name: Run selected tests
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: bash "${{ inputs.test_script }}" "${{ inputs.backend }}"
