# Reusable job for one backend (non-NVIDIA lanes and the H20 python-op job)
# on a bare self-hosted runner. The
# vendor environment is built by this repository's tools/setup.sh from
# src/flaggems_vllm/backends.yaml, so nothing is fetched from the FlagGems
# repository.

name: Backend Test

on:
  workflow_call:
    inputs:
      backend:
        description: 'Backend profile (e.g. ascend-cann900, mthreads-musa520)'
        required: true
        type: string
      runner_label:
        description: 'GitHub Actions runner label'
        required: true
        type: string
      gpu_check_script:
        description: 'Path to the accelerator check script (empty to skip)'
        required: false
        type: string
        default: ''
      changed_files:
        description: 'CI targets JSON consumed by tools/run_ci_targets.py'
        required: false
        type: string
        default: ''
      pr_id:
        description: 'ID of the PR (empty for pushes without one)'
        required: false
        type: string
        default: ''
      test_script:
        description: 'Script that runs the selected targets'
        required: false
        type: string
        default: 'tools/run-multi-backend-tests.sh'
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 120
      clang_artifact_id:
        description: 'Artifact ID for the pinned H20 Clang packages'
        required: false
        type: string
        default: ''
      uv_refresh:
        description: >-
          Set to 1 on persistent runners whose uv cache survives across jobs, so
          tools/setup.sh revalidates it (a stale entry can report success
          without installing into the freshly recreated venv). Empty keeps the
          setup.sh default.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      UV_REFRESH: ${{ inputs.uv_refresh }}
    concurrency:
      group: >-
        backend-test-${{ inputs.backend }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
        continue-on-error: true
      - uses: ./.github/actions/checkout-retry
      - uses: ./.github/actions/setup-flaggems
        with:
          backend: ${{ inputs.backend }}
          gpu_check_script: ${{ inputs.gpu_check_script }}

      - name: Download the pinned H20 Clang packages
        if: inputs.backend == 'nvidia-cuda133' && inputs.runner_label == 'h20' && inputs.clang_artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ inputs.clang_artifact_id }}
          path: ${{ runner.temp }}/h20-clang-packages

      - name: Run selected tests
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
          BACKEND: ${{ inputs.backend }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          TEST_SCRIPT: ${{ inputs.test_script }}
          PR_ID: ${{ inputs.pr_id }}
        run: |
          if [[ "$BACKEND" == "nvidia-cuda133" && "$RUNNER_LABEL" == "h20" ]]; then
            clang_dir="$(mktemp -d "${RUNNER_TEMP}/flaggems-clang-XXXXXX")"
            trap 'rm -rf -- "$clang_dir"' EXIT
            CLANG="$(bash tools/setup-tle-clang.sh extract "${RUNNER_TEMP}/h20-clang-packages" "$clang_dir")"
            export CLANG
          fi
          bash "$TEST_SCRIPT" "$BACKEND" "$PR_ID"
