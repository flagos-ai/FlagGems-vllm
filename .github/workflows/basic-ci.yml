name: Basic CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke-tests:
    name: NVIDIA smoke tests
    runs-on: h20
    timeout-minutes: 30
    env:
      DNN_VENDOR: nvidia
      PYTHONPATH: ${{ github.workspace }}/src
      VIRTUAL_ENV: /home/secure/venvs/flaggems-vllm-ci

    steps:
      - id: checkout-attempt-1
        name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        continue-on-error: true

      - id: sleep-1
        if: steps.checkout-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-2
        name: Retry checkout
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        continue-on-error: true

      - id: sleep-2
        if: steps.checkout-attempt-2.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-3
        name: Retry checkout again
        if: steps.checkout-attempt-2.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show GPU
        shell: bash
        run: nvidia-smi

      - name: Use preconfigured Python environment
        shell: bash
        run: |
          test -x "${VIRTUAL_ENV}/bin/python"
          echo "${VIRTUAL_ENV}/bin" >> "$GITHUB_PATH"
          echo "/usr/local/cuda-12.8/bin" >> "$GITHUB_PATH"

      - name: Import smoke test
        shell: bash
        run: |
          python -c "import torch, flaggems_vllm; print('torch:', torch.__version__); print('cuda available:', torch.cuda.is_available()); print('vendor:', flaggems_vllm.vendor_name); print('device:', flaggems_vllm.device); assert torch.cuda.is_available()"

      - name: Collect CI selection inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${PR_BASE_SHA}" "${GITHUB_SHA}" > changed_files.txt
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" > changed_files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt

      - name: Run selected unit tests
        shell: bash
        env:
          CHANGED_FILES_FILE: changed_files.txt
        run: bash tools/run_tests.sh nvidia
