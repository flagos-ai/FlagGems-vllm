name: basic ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  code-style:
    name: code style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref }}

      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: install style tools
        shell: bash
        run: python -m pip install pre-commit

      - id: pre_commit
        name: run pre-commit
        shell: bash
        continue-on-error: true
        run: pre-commit run --all-files --show-diff-on-failure

      - id: pre_commit_changes
        name: check pre-commit changes
        if: steps.pre_commit.outcome == 'failure'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: commit pre-commit fixes
        if: >-
          steps.pre_commit.outcome == 'failure' &&
          steps.pre_commit_changes.outputs.has_changes == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply pre-commit fixes"
          git push

      - name: verify pre-commit after autofix
        if: >-
          steps.pre_commit.outcome == 'failure' &&
          steps.pre_commit_changes.outputs.has_changes == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: pre-commit run --all-files --show-diff-on-failure

      - name: fail when pre-commit needs manual fixes
        if: >-
          steps.pre_commit.outcome == 'failure' &&
          (
            steps.pre_commit_changes.outputs.has_changes != 'true' ||
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name != github.repository
          )
        shell: bash
        run: exit 1

  select-targets:
    name: select ci targets
    needs: code-style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      tests: ${{ steps.select.outputs.tests }}
      benchmarks: ${{ steps.select.outputs.benchmarks }}
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv-select

    steps:
      - id: checkout-attempt-1
        name: check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        continue-on-error: true

      - id: sleep-1
        if: steps.checkout-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-2
        name: retry checkout
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        continue-on-error: true

      - id: sleep-2
        if: steps.checkout-attempt-2.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-3
        name: retry checkout again
        if: steps.checkout-attempt-2.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: create selector python environment
        shell: bash
        run: |
          python3 -m venv "${VIRTUAL_ENV}"
          source "${VIRTUAL_ENV}/bin/activate"
          python --version
          test -x "${VIRTUAL_ENV}/bin/python"
          echo "${VIRTUAL_ENV}/bin" >> "$GITHUB_PATH"

      - name: collect ci selection inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "${PR_BASE_SHA}" "${GITHUB_SHA}" > changed_files.txt
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" > changed_files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt

      - id: select
        name: select tests and benchmarks
        shell: bash
        run: |
          selection="$(python tools/select_tests.py \
            --changed-files changed_files.txt \
            --format shell)"
          eval "${selection}"

          echo "Test selection mode: ${TEST_SELECTION_MODE}"
          if [[ -n "${SELECTED_TESTS}" ]]; then
            echo "Selected tests: ${SELECTED_TESTS}"
          fi
          if [[ -n "${SELECTED_BENCHMARKS}" ]]; then
            echo "Selected benchmarks: ${SELECTED_BENCHMARKS}"
          fi

          echo "mode=${TEST_SELECTION_MODE}" >> "${GITHUB_OUTPUT}"
          echo "tests=${SELECTED_TESTS}" >> "${GITHUB_OUTPUT}"
          echo "benchmarks=${SELECTED_BENCHMARKS}" >> "${GITHUB_OUTPUT}"

  nvidia-tests:
    name: nvidia tests and benchmarks
    needs: select-targets
    if: needs.select-targets.outputs.tests != '' || needs.select-targets.outputs.benchmarks != ''
    runs-on: h20
    timeout-minutes: 60
    env:
      DNN_VENDOR: nvidia
      PYTHONPATH: ${{ github.workspace }}/src
      VENV_DIR: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ${{ github.workspace }}/.venv

    steps:
      - name: check out repository
        uses: actions/checkout@v6

      - name: show gpu
        shell: bash
        run: nvidia-smi

      - name: install and activate python environment
        shell: bash
        run: |
          export PATH="/usr/local/cuda-12.8/bin:${PATH}"
          bash tools/setup.sh
          source "${VENV_DIR}/bin/activate"
          test -x "${VENV_DIR}/bin/python"
          echo "VIRTUAL_ENV=${VENV_DIR}" >> "$GITHUB_ENV"
          echo "${VENV_DIR}/bin" >> "$GITHUB_PATH"
          echo "/usr/local/cuda-12.8/bin" >> "$GITHUB_PATH"
          python --version

      - name: run selected unit tests
        if: needs.select-targets.outputs.tests != ''
        shell: bash
        env:
          SELECTED_TESTS: ${{ needs.select-targets.outputs.tests }}
        run: |
          echo "Selected tests: ${SELECTED_TESTS}"
          pytest -q ${SELECTED_TESTS} --quick

      - name: run selected benchmarks
        if: needs.select-targets.outputs.benchmarks != ''
        shell: bash
        env:
          SELECTED_BENCHMARKS: ${{ needs.select-targets.outputs.benchmarks }}
        run: |
          echo "Selected benchmarks: ${SELECTED_BENCHMARKS}"
          pytest -q ${SELECTED_BENCHMARKS} --level core
