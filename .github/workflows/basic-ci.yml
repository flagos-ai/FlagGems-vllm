name: Basic CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke-tests:
    name: NVIDIA smoke tests
    runs-on: h20
    timeout-minutes: 30
    env:
      DNN_VENDOR: nvidia
      CUDA_VISIBLE_DEVICES: "0"
      PYTHONPATH: ${{ github.workspace }}/src
      CMAKE_ARGS: -DFLAGGEMS_BUILD_C_EXTENSIONS=ON -DCMAKE_BUILD_TYPE=Release
      VIRTUAL_ENV: /home/secure/venvs/flaggems-vllm-ci

    steps:
      - id: checkout-attempt-1
        name: Check out repository
        uses: actions/checkout@v6
        continue-on-error: true

      - id: sleep-1
        if: steps.checkout-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-2
        name: Retry checkout
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@v6
        continue-on-error: true

      - id: sleep-2
        if: steps.checkout-attempt-2.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-3
        name: Retry checkout again
        if: steps.checkout-attempt-2.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Show GPU
        shell: bash
        run: nvidia-smi

      - name: Use preconfigured Python environment
        shell: bash
        run: |
          test -x "${VIRTUAL_ENV}/bin/python"
          echo "${VIRTUAL_ENV}/bin" >> "$GITHUB_PATH"
          echo "/usr/local/cuda-12.8/bin" >> "$GITHUB_PATH"

      - name: Import smoke test
        shell: bash
        run: |
          python -c "import torch, flaggems_vllm; print('torch:', torch.__version__); print('cuda available:', torch.cuda.is_available()); print('vendor:', flaggems_vllm.vendor_name); print('device:', flaggems_vllm.device); assert torch.cuda.is_available()"

      - name: Run selected unit tests
        shell: bash
        run: bash tools/run_tests.sh nvidia
