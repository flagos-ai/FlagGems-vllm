name: Basic CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke-tests:
    name: NVIDIA smoke tests
    runs-on: h20
    timeout-minutes: 30
    env:
      DNN_VENDOR: nvidia
      CUDA_VISIBLE_DEVICES: "0"
      PYTHONPATH: ${{ github.workspace }}/src
      CMAKE_ARGS: -DFLAGGEMS_BUILD_C_EXTENSIONS=ON -DCMAKE_BUILD_TYPE=Release

    steps:
      - id: checkout-attempt-1
        name: Check out repository
        uses: actions/checkout@v6
        continue-on-error: true

      - id: sleep-1
        if: steps.checkout-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-2
        name: Retry checkout
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@v6
        continue-on-error: true

      - id: sleep-2
        if: steps.checkout-attempt-2.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-3
        name: Retry checkout again
        if: steps.checkout-attempt-2.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Create virtual environment
        shell: bash
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Show GPU
        shell: bash
        run: nvidia-smi

      - name: Install package and test dependencies
        shell: bash
        run: |
          export PATH="/usr/local/cuda-12.8/bin:$PATH"
          python -m pip install --upgrade pip
          python -m pip install -v -e ".[test]" --no-build-isolation

      - name: Import smoke test
        shell: bash
        run: |
          python -c "import torch, flaggems_vllm; print('torch:', torch.__version__); print('cuda available:', torch.cuda.is_available()); print('vendor:', flaggems_vllm.vendor_name); print('device:', flaggems_vllm.device); assert torch.cuda.is_available()"

      - name: Run selected unit tests
        shell: bash
        run: bash tools/run_tests.sh nvidia
