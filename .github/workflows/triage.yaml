name: triage

# pull_request_target gives the token write access on fork PRs. This workflow
# must never check out or execute code from the pull request.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true
      - id: sizer
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644  # v1.12.0
        with:
          xs_label: 'size/XSmall'
          xs_max_size: '10'
          s_label: 'size/Small'
          s_max_size: '100'
          m_label: 'size/Medium'
          m_max_size: '500'
          l_label: 'size/Large'
          l_max_size: '1000'
          xl_label: 'size/XLarge'
          fail_if_xl: 'false'
          message_if_xl: >
            This PR exceeds the recommended size of 1000 lines.
            Please make sure you are NOT addressing multiple issues with one PR.
            Note this PR might be rejected due to its size.
          github_api_url: 'https://api.github.com'
          files_to_ignore: ''
