# Keep gh-pages rebased onto main so the docs build (hugo-site.yaml)
# always publishes from a dedicated branch instead of main directly.
name: sync docs branch

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "conf/operators.yaml"
      - ".github/workflows/hugo-site.yaml"
      - ".github/workflows/sync-docs.yaml"

  workflow_dispatch:

  workflow_call:

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: check out gh-pages
        id: checkout-gh-pages
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: gh-pages
          fetch-depth: 0
        continue-on-error: true

      # First run: gh-pages does not exist yet. Create it from main.
      - name: create gh-pages from main
        if: steps.checkout-gh-pages.outcome == 'failure'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: rebase gh-pages onto main
        if: steps.checkout-gh-pages.outcome == 'success'
        run: git rebase origin/main

      - name: push gh-pages
        run: git push origin HEAD:gh-pages -f
