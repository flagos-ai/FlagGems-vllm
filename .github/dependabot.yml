version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  # pyproject.toml pins vendor wheels by URL and the vLLM stack is managed in
  # src/flaggems_vllm/backends.yaml, so only the build/test tooling is tracked.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
