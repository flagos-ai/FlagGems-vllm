# Path-based PR labels, applied by .github/workflows/triage.yaml.
#
# Backend labels (vendor/*) are intentionally NOT assigned here: tools/
# select_backends.py treats them as requests to run on self-hosted vendor
# runners, so they must stay a maintainer decision.

ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'LICENSE'
          - '*.md'
          - 'docs/**'

ops:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/flaggems_vllm/ops/**'
          - 'conf/operators.yaml'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/flaggems_vllm/runtime/backend/**'

core:
  - changed-files:
      - any-glob-to-any-file:
          - 'pyproject.toml'
          - 'src/flaggems_vllm/*.py'
          - 'src/flaggems_vllm/runtime/*.py'
          - 'src/flaggems_vllm/utils/**'
          - 'src/flaggems_vllm/testing/**'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'
          - 'pytest.ini'
          - '.pre-commit-config.yaml'

benchmark:
  - changed-files:
      - any-glob-to-any-file:
          - 'benchmark/**'

tools:
  - changed-files:
      - any-glob-to-any-file:
          - 'tools/**'
