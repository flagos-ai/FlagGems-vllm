[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"


[project]
name = "flaggems_vllm"
version = "0.3.0-dev1"
description = "FlagGems-vllm is a deep neural network function library written in Triton."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8.0"
license = { text = "Apache Software License" }
authors = [
    { name = "Bin Zhang", email = "842884726@qq.com" },
    { name = "Bingjie Wang", email = "xxx@xxx.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "flag-gems",
    "packaging",
    "pybind11",
    "PyYAML",
    "sqlalchemy",
]

[project.optional-dependencies]
test = [
    "pytest>=7.1.0",
    "scipy>=1.14,<1.18.0",  # Keep the existing NumPy version
    "einops>=0.6",
    "cupy-cuda12x>=12.0.0,<14.0.0",  # Keep the existing NumPy version
    "distro>=1.9.0",
]
# Native vLLM builds that carry the reference kernels used by the benchmark
# baselines. Each extra targets exactly one backend image.
nvidia = [
    "vllm @ https://files.pythonhosted.org/packages/00/33/3f0abda52acff437a471cf3a2bf204213eb4102975b2677512cd76f2b45e/vllm-0.24.0-cp38-abi3-manylinux_2_28_x86_64.whl",
]
metax = [
    "mcoplib @ https://repos.metax-tech.com/r/maca-pypi/packages/mcoplib/0.4.9+g8b5bd8b.maca3.8.0.25.torch2.10/mcoplib-0.4.9+g8b5bd8b.maca3.8.0.25.torch2.10-cp312-cp312-linux_x86_64.whl",
    "vllm-metax @ https://repos.metax-tech.com/r/maca-pypi/packages/vllm-metax/0.24.0+g436274.d20260813.maca3.8.2.5.torch2.10.0/vllm_metax-0.24.0+g436274.d20260813.maca3.8.2.5.torch2.10.0-cp312-cp312-linux_x86_64.whl",
]
ascend = [
    "vllm-ascend==0.24.0rc1",
]

[tool.uv]
exclude-dependencies = [
    # Torch stack: supplied by the backend image, must not be replaced.
    "torch", "torchaudio", "torchvision", "torch-npu", "numpy",
    "triton", "triton-ascend", "flagtree",
    # CUDA runtime pulled by the upstream vLLM wheel (nvidia extra).
    "cuda-bindings", "cuda-core", "cuda-python", "cuda-tile", "cuda-toolkit",
    "nvidia-cuda-cccl", "nvidia-cuda-crt", "nvidia-cuda-nvcc", "nvidia-cuda-nvrtc",
    "nvidia-cuda-runtime", "nvidia-cuda-tileiras", "nvidia-cudnn-frontend",
    "nvidia-cutlass-dsl", "nvidia-cutlass-dsl-libs-base", "nvidia-cutlass-dsl-libs-cu13",
    "quack-kernels", "tilelang", "tokenspeed-mla", "tokenspeed-triton",
    "apache-tvm-ffi",
    # Transitive pins of the plugin wheels: letting them resolve downgrades the base image.
    "transformers", "tokenizers", "starlette", "xgrammar",
]

[project.urls]
Homepage = "https://github.com/flagos-ai/FlagGems-vllm"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flaggems_vllm.runtime" = ["*/**/*.yaml", "*/**/*.cu"]
"flaggems_vllm.runtime.backend._nvidia.hopper.mega.megamoe" = ["*.cu"]
"flaggems_vllm.utils" = ["configs/*.yaml"]

[tool.black]
line-length = 88
