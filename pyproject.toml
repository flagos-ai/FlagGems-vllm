[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"


[project]
name = "flaggems_vllm"
version = "0.3.0-dev1"
description = "FlagGems-vllm is a deep neural network function library written in Triton."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8.0"
license = { text = "Apache Software License" }
authors = [
    { name = "Bin Zhang", email = "842884726@qq.com" },
    { name = "Bingjie Wang", email = "xxx@xxx.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "packaging",
    "pybind11",
    "PyYAML",
    "sqlalchemy",
]

[project.optional-dependencies]
test = [
    "pytest>=7.1.0",
    "scipy>=1.14,<1.18.0",  # Keep the existing NumPy version
    "einops>=0.6",
    "cupy-cuda12x>=12.0.0,<14.0.0",  # Keep the existing NumPy version
    "distro>=1.9.0",
]

# vLLM 0.24+empty has no native GLM-5.3 indexer baseline.
# Install these opt-in groups in this repository's test venv only.
[dependency-groups]
indexer-build = [
    "setuptools>=77.0.3,<81",
    "setuptools-scm>=8.0",
    "setuptools-rust>=1.9.0",
    "wheel",
    "packaging>=24.2",
    "jinja2",
]
indexer-test = [
    # Official vLLM v0.33.0, pinned to its release commit.
    "vllm @ https://github.com/vllm-project/vllm/archive/4ba787ec9959e566d3b587a796dff07673324da5.tar.gz",
    # Required by the native model import, absent from the empty wheel metadata.
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
]

[tool.uv.dependency-groups]
indexer-build = { requires-python = ">=3.11" }
indexer-test = { requires-python = ">=3.11" }

[tool.uv.pip]
# Reuse the preinstalled accelerator torch instead of the upstream CUDA build deps.
no-build-isolation-package = ["vllm"]

[tool.uv.pip.extra-build-variables]
vllm = { VLLM_TARGET_DEVICE = "empty", SETUPTOOLS_SCM_PRETEND_VERSION = "0.33.0" }

[project.urls]
Homepage = "https://github.com/flagos-ai/FlagGems-vllm"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flaggems_vllm.runtime" = ["*/**/*.yaml"]

[tool.black]
line-length = 88
