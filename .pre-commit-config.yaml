repos:
  # https://github.com/pre-commit/pre-commit-hooks
  - repo: https://gitcode.com/gh_mirrors/pr/pre-commit-hooks.git
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        types: [text]

      - id: check-yaml
        name: check yaml
        types: [yaml]

      - id: check-added-large-files
        name: check for added large files
  # https://github.com/PyCQA/flake8
  - repo: https://gitcode.com/gh_mirrors/fl/flake8.git
    rev: 7.1.0
    hooks:
      - id: flake8
        args: ["--ignore=F405,E731,W503,E203,E704", --max-line-length=120]
  # https://github.com/PyCQA/isort
  - repo: https://gitcode.com/gh_mirrors/is/isort.git
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
  # https://github.com/psf/black
  - repo: https://gitcode.com/gh_mirrors/bl/black.git
    rev: 24.8.0
    hooks:
      - id: black
