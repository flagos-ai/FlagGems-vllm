    - [8192, 4096]
    - [8192, 1536]
    - [8192, 2048]
    - [1, 4096]
    - [1, 1536]
    - [1, 2048]
  shape_desc: "num_tokens, hidden_size"

# ── MoE 路由 grouped_topk ───────────────────────────────────────────────────
