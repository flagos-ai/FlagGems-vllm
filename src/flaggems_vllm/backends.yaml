# FlagGems-vllm backend registry
# ==============================
#
# Single source of truth for `tools/setup.sh`.
#
# The vendor toolchain entries (python / deps / triton / flagtree / env /
# env_source) are kept aligned with FlagGems' `src/flag_gems/backends.yaml`.
# FlagGems-vllm is installed on top of the same vendor environment, so the
# two projects must agree on the torch, compiler and driver versions.
#
# Fields
# ------
# python:        Python version for the virtual environment.
# vendor:        Vendor name used by `flaggems_vllm.runtime` (the directory
#                suffix under `src/flaggems_vllm/runtime/backend/_<vendor>`).
# deps:          Vendor torch stack and accelerator libraries. Installed from
#                `pypi_base` before FlagGems / vLLM so the vendor build wins.
# triton:        Vendor Triton package (used when COMPILER=triton).
# flagtree:      FlagTree package (used when COMPILER=flagtree). Preferred
#                whenever the backend publishes one.
# triton_post_install: Extra packages installed after the vendor Triton build.
# vllm:          vLLM packages that carry the reference kernels used by the
#                tests/benchmarks. Backends without an entry here normally get
#                vLLM from the vendor image; use `tools/setup.sh --no-venv`
#                inside that image, or set VLLM_PACKAGE explicitly.
# vllm_note:     Human-readable explanation printed when `vllm` is empty.
# test_deps:     Extra backend-specific test packages (for example the
#                NVIDIA-only cupy-cuda12x). The base set is `test_deps` at the
#                top level and matches the `[test]` extra.
# env:           Environment variables written into `.venv/bin/activate`.
#                `$PATH`, `$LD_LIBRARY_PATH`, ... are expanded on activation.
# env_source:    Vendor scripts sourced during setup and on activation.
#
# The PyPI index URL is generated as:
#   pypi_base.format(vendor=<vendor derived from the backend key>)
# Override the derived vendor with an explicit `vendor:` field.
#
# Compiler selection (`COMPILER`):
#   flagtree  -> install the `flagtree:` package (default when available)
#   triton    -> install the `triton:` package
#   keep      -> leave the environment's existing compiler untouched
#   unset     -> flagtree when available, otherwise triton; in `--no-venv`
#                mode the default is `keep`

default_backend: nvidia-cuda133
python: "3.12"
pypi_base: "https://resource.flagos.net/repository/flagos-pypi-{vendor}/simple"
# FlagGems is published to the shared hosted index (also mirrored in the
# per-vendor indexes). Pin the release that this repository's tests target.
flag_gems_version: "5.4.0"
flag_gems_index: "https://resource.flagos.net/repository/flagos-pypi-hosted/simple"
# PyPI is the default fallback index. Set PIP_INDEX_URL (for example to
# https://mirrors.aliyun.com/pypi/simple) on networks where PyPI is slow.
mirror: "https://pypi.org/simple"

# Test dependencies installed independently of the project metadata. They
# mirror the `test` extra in pyproject.toml; NVIDIA profiles add cupy-cuda12x
# through their own `test_deps`. Installing them explicitly lets
# tools/setup.sh install FlagGems-vllm with --no-deps, so flag-gems' strict
# transitive pins (numpy, packaging, ...) cannot replace the vendor stack.
test_deps:
  - "pytest>=7.1.0"
  - "scipy>=1.14,<1.18.0"
  - "einops>=0.6"
  - "distro>=1.9.0"

# Pure-Python runtime dependencies of this repository (see pyproject.toml).
# Installed explicitly because the project itself is installed with --no-deps.
runtime_deps:
  - "packaging"
  - "pybind11"
  - "PyYAML>=6.0"
  - "sqlalchemy"

# Short vendor names accepted on the command line (setup.sh <alias>).
aliases:
  nvidia: nvidia-cuda133
  ascend: ascend-cann900
  hygon: hygon-dtk2604
  metax: metax-maca3810
  iluvatar: iluvatar-corex450
  mthreads: mthreads-musa520
  cambricon: cambricon-neuware472
  enflame: enflame-tops1106
  kunlunxin: kunlunxin-xre5371
  thead: thead-ppu210
  tsingmicro: tsingmicro-tsm260610
  biren: biren-br2xx
  spacemit: spacemit-xxx
  sunrise: sunrise-tangrt120
  amd: amd-rocm

backends:
