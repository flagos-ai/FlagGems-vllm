  # NVIDIA
  # ---------------------------------------------------------------------------
  nvidia-cuda128:
    vendor: nvidia
    python: "3.12"
    triton: triton==3.6.0
    flagtree: flagtree==0.6.1
    vllm:
      - vllm==0.20.2
    test_deps:
      - "cupy-cuda12x>=12.0.0,<14.0.0"
    env:
      PATH: /usr/local/cuda/bin:$PATH
      LD_LIBRARY_PATH: /usr/local/cuda/lib64:$LD_LIBRARY_PATH
    deps:
      - numpy==1.26.4
      - torch==2.10.0+cu128
      - torchaudio==2.10.0+cu128
      - torchvision==0.25.0+cu128

  nvidia-cuda133:
    vendor: nvidia
    python: "3.12"
    triton: triton==3.6.0
