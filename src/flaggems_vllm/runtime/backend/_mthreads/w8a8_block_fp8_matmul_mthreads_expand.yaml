# Expanded tuning spaces mapped to the MThreads generic kernel.
# BLOCK_M/BLOCK_N are mapped to the kernel's logical X/Y axes. Each dispatch entry has
# its own LibTuner so general, swap-AB, split-K, and short-K never share cache.

w8a8_block_fp8_general:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
      num_stages: stages
      num_warps: warps
    block_m: [16, 64, 128]
    block_n: [32, 128]
    block_k: [128]
    group_m: [16, 32, 64]
    stages: [3, 4, 5]
    warps: [4, 8]
  - strategy:
      M: default
      N: default
      K: default
      stride_am: default
      stride_ak: default
      stride_bn: default
      stride_bk: default
      stride_asm: default
      stride_ask: default
      stride_bsn: default
      stride_bsk: default
      GROUP_N: default
      GROUP_K: default
      SWAP_AB: default
      MIN_Y: default

