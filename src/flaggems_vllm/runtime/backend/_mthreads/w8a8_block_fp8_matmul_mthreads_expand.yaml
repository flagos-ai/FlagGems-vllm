    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
      num_stages: stages
      num_warps: warps
    block_m: [32, 64, 128]
    block_n: [4, 8, 16, 32]
    block_k: [64, 128]
    group_m: [1, 2, 4, 8, 16]
    stages: [3, 4, 5]
    warps: [2, 4, 8]
  - strategy:
      M: default
      N: default
      K: default
      stride_am: default
