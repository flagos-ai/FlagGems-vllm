# 7 x 4 x 4 = 112 schedules before legality/resource pruning.
silu_mul_per_token_group_quant_fp8_tile:
  - gen: true
    param_map:
      META:
        BR: br
        BG: bg
      num_warps: warps
      num_stages: stages
    br: [1, 2, 4, 8, 16, 32, 64]
    bg: [1, 2, 4, 8]
    warps: [1, 2, 4, 8]
    # The kernel has no pipeline loop; additional stages add no search value.
    stages: [1]
