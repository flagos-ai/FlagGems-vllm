compute_global_topk_indices_and_lens:
  - META:
      BLOCK: 64
      TPP: 4
    num_warps: 4
    num_stages: 3

w8a8_block_int8_bmm:
  - META:
      BLOCK_M: 16
      BLOCK_N: 64
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_M: 16
      BLOCK_N: 128
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_N: 64
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_N: 128
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_N: 64
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_N: 128
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_N: 64
    num_warps: 8
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_N: 128
    num_warps: 8
    num_stages: 2

  - META:
      BLOCK_M: 128
      BLOCK_N: 128
    num_warps: 4
    num_stages: 1

w8a8_block_int8_gemv:
  - META:
      BLOCK_N: 1
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_N: 2
    num_warps: 4
    num_stages: 1
  - META:
      BLOCK_N: 4
    num_warps: 4
    num_stages: 1

dequantize_and_gather_k_cache:
  - META:
      num_workers: 128
    num_warps: 2
  - META:
      num_workers: 256
    num_warps: 2
  - META:
      num_workers: 512
    num_warps: 2
  - META:
      num_workers: 1024
    num_warps: 2
  - META:
      num_workers: 2048
    num_warps: 2
  - META:
      num_workers: 4096
    num_warps: 2

w8a8_block_int8_matmul_metax:
  - META:
      BLOCK_M: 32
      BLOCK_N: 32
      GROUP_M: 4
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 16
      BLOCK_N: 64
      GROUP_M: 8
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_N: 64
      GROUP_M: 8
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 32
      BLOCK_N: 128
      GROUP_M: 8
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 64
      BLOCK_N: 128
      GROUP_M: 8
    # MC550's INT8 MMA table uses the 4-warp 64x128xK layout.  The
    # 8-warp variant falls outside that table and is slower for the
    # medium-M fallback path.
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 128
      BLOCK_N: 128
      GROUP_M: 8
    # The 128x128x128 entry is one of MetaX's native 8-warp INT8 MMA
    # layouts and improves the large-M fallback shapes.
    num_warps: 8
    num_stages: 2

w8a8_block_int8_swap_metax:
  - META:
      BLOCK_M: 16
      BLOCK_N: 32
      GROUP_M: 4
    num_warps: 2
    num_stages: 3
  - META:
      BLOCK_M: 16
      BLOCK_N: 32
      GROUP_M: 8
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 16
      BLOCK_N: 64
      GROUP_M: 8
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_M: 16
      BLOCK_N: 128
      GROUP_M: 8
    num_warps: 4
    num_stages: 2

w8a8_block_int8_gemv_metax:
  - META:
      BLOCK_N: 64
      BLOCK_K: 128
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_N: 128
      BLOCK_K: 128
    num_warps: 4
    num_stages: 2
  - META:
      BLOCK_N: 256
      BLOCK_K: 128
    num_warps: 8
    num_stages: 2

# Compact split-K candidates, timed together with the FP32 reduction.
w8a8_block_int8_splitk_metax:
  - META: {BLOCK_M: 16, BLOCK_N: 32, GROUP_M: 4, SPLITS: 4, SWAP: true}
    num_warps: 2
    num_stages: 2
  - META: {BLOCK_M: 32, BLOCK_N: 64, GROUP_M: 8, SPLITS: 4, SWAP: false}
    num_warps: 4
    num_stages: 2
  - META: {BLOCK_M: 64, BLOCK_N: 128, GROUP_M: 8, SPLITS: 4, SWAP: false}
    num_warps: 4
    num_stages: 2
  - META: {BLOCK_M: 16, BLOCK_N: 32, GROUP_M: 4, SPLITS: 8, SWAP: true}
    num_warps: 2
    num_stages: 2
  - META: {BLOCK_M: 32, BLOCK_N: 64, GROUP_M: 8, SPLITS: 8, SWAP: false}
    num_warps: 4
    num_stages: 2
  - META: {BLOCK_M: 64, BLOCK_N: 128, GROUP_M: 8, SPLITS: 8, SWAP: false}
    num_warps: 4
    num_stages: 2
  - META: {BLOCK_M: 16, BLOCK_N: 32, GROUP_M: 4, SPLITS: 16, SWAP: true}
    num_warps: 2
    num_stages: 2
  - META: {BLOCK_M: 32, BLOCK_N: 64, GROUP_M: 8, SPLITS: 16, SWAP: false}
    num_warps: 4
    num_stages: 2
  - META: {BLOCK_M: 64, BLOCK_N: 128, GROUP_M: 8, SPLITS: 16, SWAP: false}
    num_warps: 4
    num_stages: 2
