# Shifted mHC boundary (DSV4.1), PPU hc=4 path.  The generic spaces are the
# NVIDIA ones; these replace them for the fused PPU kernels.
#
# H-tiled post + collapse + sum-of-squares kernel.  The token-fused kernel
# below covers H <= 8192; this wider-row fallback tiles the hidden axis across
# CTAs.  The sweep starts at 128 (the smallest tile the partials scratch is
# sized for).
mhc_shifted_post_collapse:
  - META: {BLOCK_H: 128}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_H: 256}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_H: 512}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_H: 512}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_H: 1024}
    num_warps: 4
    num_stages: 1
  - META: {BLOCK_H: 1024}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_H: 2048}
    num_warps: 8
    num_stages: 1
  - META: {BLOCK_H: 4096}
    num_warps: 8
    num_stages: 1

# Pure split-K project GEMM: (N, hc*H) @ (hc*H, 24), BLOCK_N stays 32 so one
# CTA covers all 24 mix columns.  Without the fused sum-of-squares reduction
# the K loop can pipeline; the largest tile still fits the PPU's 256 KB smem.
mhc_shifted_project_thead:
  - gen: true
    param_map:
      META: {BLOCK_M: bm, BLOCK_K: bk, BLOCK_N: bn}
      num_warps: w
      num_stages: s
    bm: [16, 32, 64, 128]
    bk: [64, 128]
    bn: [32]
    w: [4, 8]
    s: [1, 2, 3]
  # Deep-pipeline variants: BK=32 with more stages wins for medium-N wide-H
  # shapes, and stages 4 is the plateau for the large prefill GEMM.
  - gen: true
    param_map:
      META: {BLOCK_M: bm, BLOCK_K: bk, BLOCK_N: bn}
      num_warps: w
      num_stages: s
    bm: [128]
    bk: [32]
    bn: [32]
    w: [8]
    s: [4, 6, 8]
  - gen: true
    param_map:
      META: {BLOCK_M: bm, BLOCK_K: bk, BLOCK_N: bn}
      num_warps: w
      num_stages: s
    bm: [64, 128]
    bk: [128]
    bn: [32]
    w: [8]
    s: [4]
  - gen: true
    param_map:
      META: {BLOCK_M: bm, BLOCK_K: bk, BLOCK_N: bn}
      num_warps: w
      num_stages: s
    bm: [64]
    bk: [64]
    bn: [32]
    w: [8]
    s: [4, 6]

# Project-partial + sum-of-squares reduction and Sinkhorn coefficients.
# TOKEN_TILE tokens share a program so the serial Sinkhorn runs as [T]-vector
# math; T=1 keeps the old per-token shape.
mhc_shifted_coeff_thead:
  - gen: true
    param_map:
      META: {TOKEN_TILE: tt}
      num_warps: w
      num_stages: 1
    tt: [1, 2, 4, 8]
    w: [2, 4, 8]

# One CTA per token for H <= 8192: post + collapse + sum of squares + optional
# RMSNorm.  BLOCK_H is next_power_of_2(H) and comes from the host, so only the
# warp count is tuned.
mhc_shifted_post_collapse_norm_thead:
  - META: {}
    num_warps: 4
    num_stages: 1
  - META: {}
    num_warps: 8
    num_stages: 1

# Four-stream project GEMM: each residual stream is a separate K slab, so the
# per-CTA loop is H (or H/split_k) instead of 4H and the four weight slabs stay
# in L2.  Used for num_tokens >= 256; the full-K project kernel covers smaller
# batches.  The stream sweep picked BM 32/64/128, BK 64/128, four warps.
mhc_shifted_project_thead_stream:
  - gen: true
    param_map:
      META: {BLOCK_M: bm, BLOCK_K: bk, BLOCK_N: bn}
      num_warps: w
      num_stages: s
    bm: [32, 64, 128]
    bk: [64, 128]
    bn: [32]
    w: [4]
    s: [2, 3]

# Token-loop fused post+collapse+ssq+norm.  The flat kernel keeps the whole
# row in registers; this variant streams H in BLOCK_H tiles with an explicit
# pipeline depth and pays one extra NH read for the norm's second pass.
mhc_shifted_post_collapse_norm_loop_thead:
  - gen: true
    param_map:
      META: {BLOCK_H: bh, PIPE_STAGES: ps}
      num_warps: w
      num_stages: 1
    bh: [512, 1024, 2048]
    ps: [1, 2, 3]
    w: [4, 8]

# Full-K project with an AIU async A load.  Only the contiguous (N, hc*H)
# matrix is eligible: the stream-split A is a strided sub-matrix and keeps
# regular loads.  PIPE_STAGES and num_stages must agree for the async copies.
mhc_shifted_project_thead_aiu:
  - gen: true
    param_map:
      META: {BLOCK_M: bm, BLOCK_K: bk, BLOCK_N: bn, PIPE_STAGES: ps}
      num_warps: w
      num_stages: ps
    bm: [32, 64, 128]
    bk: [64, 128]
    bn: [32]
    w: [4, 8]
    ps: [3]
