# Expand parameter ranges; unsupported combinations are pruned by each tuner.
# Default candidates remain in tune_configs.yaml.

w8a8_block_int8_matmul:
  - config: null
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        GROUP_M: group_m
      num_stages: stages
      num_warps: warps
    block_m: [16, 32, 64, 128]
    block_n: [32, 64, 128]
    group_m: [4, 8, 16, 32]
    stages: [2, 3]
    warps: [2, 4, 8]
  - strategy:
      M: default
      N: default
      K: default
      GROUP_N: default
      GROUP_K: default
      SPLITS: default

w8a8_block_int8_swap:
  - config: null
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        GROUP_M: group_m
      num_stages: stages
      num_warps: warps
    block_m: [16, 32]
    block_n: [16, 32, 64, 128]
    group_m: [1, 4, 8]
    stages: [2, 3]
    warps: [2, 4, 8]
  - strategy:
      M: default
      N: default
      K: default
      GROUP_N: default
      GROUP_K: default
      SPLITS: default

w8a8_block_int8_gemv:
  - config: null
    param_map:
      META:
        BLOCK_N: block_n
        BLOCK_K: block_k
      num_stages: stages
      num_warps: warps
    block_n: [32, 64, 128, 256, 512]
    block_k: [64, 128]
    stages: [2, 3]
    warps: [2, 4, 8]
  - strategy:
      N: default
      K: default

w8a8_block_int8_splitk:
  - config: null
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        GROUP_M: group_m
        SPLITS: splits
        SWAP: swap
      num_stages: stages
      num_warps: warps
    block_m: [16, 32, 64]
    block_n: [32, 64, 128]
    group_m: [4, 8]
    splits: [1, 2, 4, 8, 16]
    swap: [false, true]
    stages: [2]
    warps: [2, 4, 8]
  - strategy:
      M: default
      N: default
      K: default
      GROUP_N: default
      GROUP_K: default
