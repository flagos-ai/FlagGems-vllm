# Hygon DCU INT8 2-D matmul candidates.  SWAP_AB is compiled into the
# candidate so LibTuner can select the native dot layout per shape.
w8a8_block_int8_matmul_hygon:
  # SCHEDULE: 0 = native dot, 1 = incremental pointers, 2/3 = small-M vectors.
  # Vector schedules keep fixed (rows, columns, K blocks): (2, 8, 1)/(2, 16, 8).
  # Their BLOCK_M/N/K fields are unused placeholders for the shared cache schema.
- META:
    BLOCK_M: 1
    BLOCK_N: 128
    BLOCK_K: 64
    GROUP_M: 8
    SWAP_AB: true
    UNROLL: 1
    SCHEDULE: 0
  num_warps: 2
  num_stages: 2
- META:
    BLOCK_M: 2
    BLOCK_N: 128
    BLOCK_K: 64
    GROUP_M: 8
    SWAP_AB: true
    UNROLL: 1
    SCHEDULE: 0
  num_warps: 2
  num_stages: 2
- META:
