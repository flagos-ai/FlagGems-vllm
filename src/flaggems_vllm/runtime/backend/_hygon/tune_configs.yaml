    SWAP_AB: true
    UNROLL: 1
    SCHEDULE: 0
  num_warps: 2
  num_stages: 2
- META:
    BLOCK_M: 8
    BLOCK_N: 128
    BLOCK_K: 64
    GROUP_M: 8
    SWAP_AB: true
    UNROLL: 1
    SCHEDULE: 0
  num_warps: 2
  num_stages: 2
- META:
