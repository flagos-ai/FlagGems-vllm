# Expand parameter ranges; unsupported combinations are pruned by each tuner.
# Default candidates remain in tune_configs.yaml.
# Performance pruning retains their eligible combinations and filters the
# expanded general and split-K grids before compilation.

w8a8_block_int8_general:
  - config: null
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        SWAP_AB: swap_ab
        UNROLL: unroll
        SCHEDULE: schedule
      num_stages: stages
      num_warps: warps
    block_m: [1, 2, 4, 8, 16, 32, 64, 128]
    block_n: [64, 128]
    block_k: [64, 128]
    group_m: [1, 8, 32]
    swap_ab: [false, true]
    unroll: [1, 2]
    schedule: [0, 1, 2, 3]
    stages: [1, 2, 3]
    warps: [1, 2, 4, 8]
  - strategy:
      M: default
      N: default
      K: default
      GROUP_N: default
      GROUP_K: default

w8a8_block_int8_gemv_block:
  - config: null
    param_map:
      META:
        BLOCK_N: block_n
        BLOCK_K: block_k
        VECTOR: vector
        CHUNKS: chunks
      num_stages: stages
      num_warps: warps
    block_n: [4, 8, 16, 32, 64, 128, 256, 512]
    block_k: [64, 128]
    vector: [false, true]
    chunks: [1, 2, 4, 8]
    stages: [1, 2]
    warps: [1, 2, 4, 8]
  - strategy:
      N: default
      K: default
      GROUP_N: default
      GROUP_K: default

w8a8_block_int8_splitk:
  - config: null
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        GROUP_M: group_m
        SPLITS: splits
        SWAP: swap
        VECTOR: vector
        CHUNKS: chunks
      num_stages: stages
      num_warps: warps
    block_m: [1, 16, 32, 64, 128]
    block_n: [8, 16, 32, 64, 128]
    group_m: [1, 8]
    splits: [1, 2, 4, 8, 16, 32, 64]
    swap: [false, true]
    vector: [false, true]
    chunks: [1, 2, 4, 8]
    stages: [1, 2]
    warps: [2, 4, 8]
  - strategy:
      M: default
      N: default
      K: default
      GROUP_N: default
      GROUP_K: default
