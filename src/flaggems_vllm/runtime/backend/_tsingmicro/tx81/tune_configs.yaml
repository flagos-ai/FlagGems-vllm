attention:
  - gen: true
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        PRE_LOAD_V: pre_load_v
      num_warps: warps
      num_stages: stages
    block_m:
      - 32
      - 64
      - 128
      - 256
    block_n:
      - 32
      - 64
      - 128
    pre_load_v:
      - true
      - false
    warps:
      - 1
    stages:
      - 1
      - 2
attention_bwd:
  - gen: true
    param_map:
      META: metas
      num_warps: warps
      num_stages: stages
    metas:
      # Keep tiles aligned with NVIDIA-proven configs. Larger BLOCK_N1/M2 (256)
      # can be selected by causal-specialized autotune and misbehave when Q>>KV.
      - {BLOCK_M1: 32, BLOCK_N1: 128, BLOCK_M2: 128, BLOCK_N2: 32}
      - {BLOCK_M1: 64, BLOCK_N1: 128, BLOCK_M2: 64, BLOCK_N2: 64}
      - {BLOCK_M1: 64, BLOCK_N1: 128, BLOCK_M2: 64, BLOCK_N2: 32}
      - {BLOCK_M1: 64, BLOCK_N1: 128, BLOCK_M2: 128, BLOCK_N2: 64}
      - {BLOCK_M1: 64, BLOCK_N1: 128, BLOCK_M2: 128, BLOCK_N2: 32}
    warps:
      - 1
    stages:
      - 1

cross_entropy_loss:
  - META:
      BLOCK_C: 256
      BLOCK_D: 1
    num_warps: 1
  - META:
      BLOCK_C: 256
      BLOCK_D: 4
    num_warps: 4
  - META:
      BLOCK_C: 256
      BLOCK_D: 16
    num_warps: 4
  - META:
      BLOCK_C: 512
      BLOCK_D: 1
    num_warps: 4
  - META:
      BLOCK_C: 512
      BLOCK_D: 4
    num_warps: 4
  - META:
      BLOCK_C: 512
      BLOCK_D: 16
    num_warps: 4
  - META:
      BLOCK_C: 1024
      BLOCK_D: 1
    num_warps: 4
  - META:
      BLOCK_C: 1024
      BLOCK_D: 4
    num_warps: 4
  - META:
      BLOCK_C: 1024
      BLOCK_D: 16
    num_warps: 4
