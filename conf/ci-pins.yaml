# Single source of truth for all version pins used by FlagGems-vllm CI.
#
# Used by:
#   tools/setup.sh          — reads these at startup via awk (pre-pyyaml)
#   tools/check_ci_pins.py  — validates that every pin file agrees
#
# When bumping any version, change only this file. setup.sh and
# check_ci_pins.py derive every pin from it; there is no other place to edit.
#
# torch/torchaudio/torchvision must match the nvidia-cuda133 entry in
# FlagGems' src/flag_gems/backends.yaml so that FlagGems-vllm's H20 CI
# shares the same torch ABI as the FlagGems environment it installs into.
# flagtree must match the same entry's "flagtree:" field.

# FlagGems SHA pinned in basic-ci.yml and .github/actions/setup-flaggems/action.yml.
# This entry is validated by check_ci_pins.py (regex scan of those files).
flaggems_sha: "42d396ff8270f7b051f478217929f75484e53ef4"

# H20 NVIDIA stack — mirrors FlagGems' nvidia-cuda133 backend.
vllm: "0.20.2"
python: "3.12"
torch: "2.11.0+cu130"
torchaudio: "2.11.0+cu130"
torchvision: "0.26.0+cu130"
flagtree: "0.7.0"
